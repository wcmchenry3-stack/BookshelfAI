# Render topology for BookshelfAI
#
# Prod (branch `main`): bookshelf-api     + bookshelf-web     — the existing
#                       services; their hostnames (bookshelfapi.buffingchi.com,
#                       bookshelfai.buffingchi.com) are already live. DATABASE_URL
#                       is a Supabase Postgres session pooler URL (port 5432 —
#                       never the 6543 transaction pooler; Render has no
#                       outbound IPv6, so Supabase's direct host is unreachable
#                       from it).
# Dev  (branch `dev`):  bookshelf-api-dev + bookshelf-web-dev — new services.
#                       DATABASE_URL is Render Postgres `bookshelf-db` (see
#                       `databases:` below).
#
# The prod DATABASE_URL lives ONLY in the Render dashboard (`sync: false` below)
# — never in this file, a PR, or a chat/tool argument. Prod deploys happen only
# via `.github/workflows/deploy.yml`, which runs CI first and then a Render
# deploy + ZAP scan per service (`autoDeploy: false` on both prod services
# below). See `docs/RENDER.md` for the full topology, connection rules, and the
# first-prod-deploy checklist — including the cutover order (dev pair created
# and verified first; only then is prod switched to Supabase).

services:
  # --- Production API (branch main). autoDeploy is off — Render's own
  # auto-deploy would ship a commit before CI finishes and skip the ZAP scan.
  # .github/workflows/deploy.yml is the only thing that deploys this service.
  - type: web
    name: bookshelf-api
    env: python
    region: oregon
    plan: starter
    branch: main
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health
    rootDir: backend
    envVars:
      # Supabase session pooler URL (*.pooler.supabase.com, port 5432 — never
      # the 6543 transaction pooler, never the Render dev DB). Dashboard secret
      # only; see docs/RENDER.md.
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://bookshelfai.buffingchi.com"]'
      - key: TRUSTED_HOSTS
        value: '["bookshelfapi.buffingchi.com"]'
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false # required for Google OAuth login; empty breaks auth
      - key: GOOGLE_IOS_CLIENT_ID
        sync: false # required for iOS Google Sign-In token verification
      - key: GOOGLE_ANDROID_CLIENT_ID
        sync: false # required for Android Google Sign-In token verification
      - key: GOOGLE_CLIENT_SECRET
        sync: false # required for the Google OAuth code exchange
      - key: JWT_PRIVATE_KEY
        sync: false # required to sign session JWTs; never reuse dev's keypair
      - key: JWT_PUBLIC_KEY
        sync: false # required to verify session JWTs; never reuse dev's keypair
      - key: OPENAI_API_KEY
        sync: false # required for the ChatGPT Vision book-scan feature

  # --- Production static web (branch main). autoDeploy is off — see the note
  # on bookshelf-api above; same workflow deploys both.
  - type: web
    name: bookshelf-web
    env: static
    region: oregon
    branch: main
    autoDeploy: false
    buildCommand: npm ci && printf "EXPO_PUBLIC_API_URL=%s\nEXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=%s\nEXPO_PUBLIC_SENTRY_DSN=%s\nEXPO_PUBLIC_ENVIRONMENT=%s\n" "$EXPO_PUBLIC_API_URL" "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" "$EXPO_PUBLIC_SENTRY_DSN" "$EXPO_PUBLIC_ENVIRONMENT" > .env && npx expo export --platform web --clear
    staticPublishPath: dist
    rootDir: frontend
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: 'max-age=31536000; includeSubDomains'
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' https: data:; connect-src 'self' https://bookshelfapi.buffingchi.com https://*.ingest.us.sentry.io https://feedback-worker.wcmchenry3.workers.dev; style-src 'self' 'unsafe-inline'; script-src 'self'"
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: 'public, max-age=31536000, immutable'
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://bookshelfapi.buffingchi.com
      - key: EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: EXPO_PUBLIC_SENTRY_DSN
        sync: false
      - key: EXPO_PUBLIC_ENVIRONMENT
        value: production

  - type: web
    name: bookshelf-api-dev
    env: python
    region: oregon
    plan: starter
    branch: dev
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bookshelf-db
          property: connectionString
      # staging, not development: Settings.is_hardened (PR #448) treats every
      # environment except development/test as hardened (TrustedHost,
      # CF-Connecting-IP trust, /docs disabled, HSTS, /auth/test-login
      # unregistered). Dev must exercise the hardened path like prod does.
      - key: ENVIRONMENT
        value: staging
      - key: CORS_ORIGINS
        sync: false # dashboard-authoritative — dev hostnames are not fixed here
      - key: TRUSTED_HOSTS
        sync: false # dashboard-authoritative — dev hostnames are not fixed here
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false # required for Google OAuth login; empty breaks auth
      - key: GOOGLE_IOS_CLIENT_ID
        sync: false # required for iOS Google Sign-In token verification
      - key: GOOGLE_ANDROID_CLIENT_ID
        sync: false # required for Android Google Sign-In token verification
      - key: GOOGLE_CLIENT_SECRET
        sync: false # required for the Google OAuth code exchange
      - key: JWT_PRIVATE_KEY
        sync: false # required to sign session JWTs; never reuse prod's keypair
      - key: JWT_PUBLIC_KEY
        sync: false # required to verify session JWTs; never reuse prod's keypair
      - key: OPENAI_API_KEY
        sync: false # required for the ChatGPT Vision book-scan feature

  - type: web
    name: bookshelf-web-dev
    env: static
    region: oregon
    branch: dev
    buildCommand: npm ci && printf "EXPO_PUBLIC_API_URL=%s\nEXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=%s\nEXPO_PUBLIC_SENTRY_DSN=%s\nEXPO_PUBLIC_ENVIRONMENT=%s\n" "$EXPO_PUBLIC_API_URL" "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" "$EXPO_PUBLIC_SENTRY_DSN" "$EXPO_PUBLIC_ENVIRONMENT" > .env && npx expo export --platform web --clear
    staticPublishPath: dist
    rootDir: frontend
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: 'max-age=31536000; includeSubDomains'
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' https: data:; connect-src 'self' https://bookshelfapi-dev.buffingchi.com https://*.ingest.us.sentry.io https://feedback-worker.wcmchenry3.workers.dev; style-src 'self' 'unsafe-inline'; script-src 'self'"
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: 'public, max-age=31536000, immutable'
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://bookshelfapi-dev.buffingchi.com
      - key: EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: EXPO_PUBLIC_SENTRY_DSN
        sync: false
      # staging, not development — see the ENVIRONMENT comment on
      # bookshelf-api-dev above; dev should exercise the hardened path.
      - key: EXPO_PUBLIC_ENVIRONMENT
        value: staging

databases:
  # Dev only. Production uses Supabase — see the header comment above and
  # docs/RENDER.md. No `main`-branch service may reference this via
  # fromDatabase; backend/tests/unit/test_render_yaml.py enforces that.
  - name: bookshelf-db
    plan: basic-256mb
    region: oregon
