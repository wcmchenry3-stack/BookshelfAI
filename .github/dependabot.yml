version: 2
updates:
  # ── Python backend ──────────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    # Majors wait three weeks after release before Dependabot proposes them
    # (#646: anthropic 2.0 arrived two days old with a new API version).
    # Security updates are not delayed by cooldown.
    cooldown:
      semver-major-days: 21
    groups:
      # Security CVE fixes get their own group so they can be merged fast
      # without waiting for a routine minor/patch batch.
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major version upgrades for core framework deps require deliberate
      # migration work — keep them out of auto-PRs.
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "alembic"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "backend"

  # ── Frontend npm ─────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    # Majors wait three weeks after release before Dependabot proposes them
    # (#646: anthropic 2.0 arrived two days old with a new API version).
    # Security updates are not delayed by cooldown.
    cooldown:
      semver-major-days: 21
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      expo-ecosystem:
        applies-to: version-updates
        patterns:
          - "expo*"
          - "@expo/*"
        update-types:
          - "minor"
          - "patch"
      # Catch-all so the rest of the frontend tree batches into one weekly PR
      # instead of opening individually. Mirrors the pip block above. Majors
      # are excluded and still arrive on their own.
      minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Expo SDK and React Native upgrades require native module compatibility
      # testing and coordinated migration — handled manually on a dedicated branch.
      #
      # The wildcard matters: this previously read "expo", which covers only the
      # `expo` package itself. expo-status-bar, expo-secure-store,
      # expo-web-browser and babel-preset-expo were all still opening individual
      # major PRs, fragmenting an SDK upgrade that has to be done in one pass.
      - dependency-name: "expo*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "@expo/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "babel-preset-expo"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "jest-expo"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "eslint-config-expo"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "react-native"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # SDK-managed peer packages: `npx expo install --check` pins these to a
      # specific minor range per SDK release. Neither name matches expo*, so
      # the minor-patch catch-all group kept bumping them past what the
      # installed SDK expects, breaking the expo-compat CI check (twice now —
      # see the fix that reverted PR #423's bump of these two).
      - dependency-name: "react-native-safe-area-context"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "react-native-screens"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      # Expo SDK 58 pins jest to ~30.5.2 and @types/jest to 30.0.0 (jest-expo@58
      # runs on jest 30). Move them only with the SDK: a bump past the SDK's
      # range fails the expo-compat check (see closed PR #441).
      - dependency-name: "jest"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "@types/jest"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # jest-environment-jsdom must match the jest major (SDK 58: ~30.5.2). Bump
      # together with jest on the Expo SDK upgrade (see closed PR #865).
      - dependency-name: "jest-environment-jsdom"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # SDK-managed native module: Expo SDK 58 expects 14.0.1; a bump past that
      # fails expo-compat (see closed PR #864). Move it with the SDK.
      - dependency-name: "react-native-webview"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # Expo SDK 58 compatibility matrix requires ~8.28.0 — block all bumps until
      # Expo explicitly supports a newer major.
      - dependency-name: "@sentry/react-native"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # @sentry/browser and @sentry/core are devDependencies used only by
      # __tests__/unit/sentryScrub.test.ts. They are pinned to the exact version
      # @sentry/react-native bundles (#736) so the scrub test exercises the same
      # Sentry the app ships, so every update type is ignored, matching the
      # @sentry/react-native ignore above. Bump all three together when Expo
      # allows a newer @sentry/react-native.
      - dependency-name: "@sentry/browser"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "@sentry/core"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    labels:
      - "dependencies"
      - "frontend"

  # ── GitHub Actions ───────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Los_Angeles"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
