name: DB Backup

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

env:
  # Must match the Supabase Postgres major version — run `SELECT version();`
  # on production to confirm.  Update here if the version changes.
  PG_MAJOR: "17"

jobs:
  backup:
    name: Dump → encrypt → upload
    runs-on: ubuntu-latest
    environment: backup
    timeout-minutes: 15

    steps:
      - name: Install PostgreSQL ${{ env.PG_MAJOR }} client and age
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] \
            https://apt.postgresql.org/pub/repos/pgdg \
            $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql-client-${{ env.PG_MAJOR }} age awscli

      - name: pg_dump
        env:
          PGPASSWORD: "" # password is embedded in the DSN
        run: |
          pg_dump \
            --no-owner \
            --no-acl \
            --format=plain \
            "${{ secrets.BACKUP_DATABASE_URL }}" \
            | gzip -9 > backup.sql.gz

      - name: Encrypt with age
        run: |
          age \
            --recipient "${{ secrets.BACKUP_AGE_RECIPIENT }}" \
            --output backup.sql.gz.age \
            backup.sql.gz
          rm -f backup.sql.gz

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H%M%SZ)
          aws s3 cp backup.sql.gz.age \
            "s3://${{ secrets.R2_BUCKET }}/bookshelf/prod/${TIMESTAMP}.sql.gz.age" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          echo "Uploaded bookshelf/prod/${TIMESTAMP}.sql.gz.age"
