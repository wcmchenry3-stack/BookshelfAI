name: CI

on:
  pull_request:
    branches: [dev, main]
    # Default types plus ready_for_review, so the native build checks (skipped
    # on drafts) run when a draft PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # === Change detection (#767) =============================================
  # One cheap job decides whether the expensive bundle/native build checks run.
  # Plain `git diff` against the PR base (no third-party action). On push and
  # workflow_call (Deploy) there is no PR base, so both outputs are 'true' and
  # the checks always run. A job skipped via `if:` reports success to required
  # checks.
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      native: ${{ steps.detect.outputs.native }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event is $EVENT_NAME: running all checks"
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: a move out of frontend/ must count its source path too.
          # Fail closed: if the diff can't be computed, run everything. A
          # failed detect job would skip the checks, and skipped required
          # checks report success.
          if ! CHANGED=$(git diff --name-only --no-renames "$BASE_SHA"...HEAD) || [ -z "$BASE_SHA" ]; then
            echo "::warning::Could not diff against the PR base; running all checks"
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          echo "$CHANGED"
          # native: anything that can change the iOS/Android native build.
          # Podfile, Gradle files and ios/ci_scripts live under frontend/ios
          # and frontend/android, so the directory prefixes cover them.
          NATIVE_RE='^(frontend/(ios|android|plugins)/|frontend/(app\.json|app\.config\.[A-Za-z]+|package\.json|package-lock\.json)$|\.github/workflows/ci\.yml$)'
          # frontend: any frontend file (JS bundle inputs) plus this workflow.
          FRONTEND_RE='^(frontend/|\.github/workflows/ci\.yml$)'
          if echo "$CHANGED" | grep -qE "$NATIVE_RE"; then NATIVE=true; else NATIVE=false; fi
          if echo "$CHANGED" | grep -qE "$FRONTEND_RE"; then FRONTEND=true; else FRONTEND=false; fi
          echo "native=$NATIVE" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "native=$NATIVE frontend=$FRONTEND"

  # === Tier 0: Hygiene gates (run immediately, must pass before tier 1) ====

  gate-main-source:
    uses: wcmchenry3-stack/.github/.github/workflows/called-gate-main-source.yml@main
    secrets: inherit

  secret-scan:
    uses: wcmchenry3-stack/.github/.github/workflows/called-secret-scan.yml@main
    secrets: inherit

  lint-python:
    uses: wcmchenry3-stack/.github/.github/workflows/called-lint-python.yml@main
    with:
      working-directory: backend
      # Keep in sync with backend/requirements-dev.txt — unpinned installs let
      # upstream rule changes silently break lint on unrelated PRs.
      black-version: '26.10.1'
      ruff-version: '0.17.1'
    secrets: inherit

  lint-frontend:
    uses: wcmchenry3-stack/.github/.github/workflows/called-lint-frontend.yml@main
    with:
      working-directory: frontend
      run-a11y: true
    secrets: inherit

  # === Tier 1: Substantive fast checks (need lint + secret-scan) ===========

  backend-health:
    # Skip when called from the Deploy workflow (github.workflow is the
    # caller's name inside a workflow_call): this job probes the live
    # bookshelf-api Render origin, which becomes PROD after cutover, so a
    # prod outage would fail this job and block the very deploy meant to fix
    # it. On pull_request/push to dev/main it still runs as a normal CI gate.
    if: github.workflow != 'Deploy'
    needs: [lint-python, lint-frontend, secret-scan]
    uses: wcmchenry3-stack/.github/.github/workflows/called-backend-health.yml@main
    with:
      # Direct Render origin intentionally used here instead of bookshelfapi.buffingchi.com.
      # Cloudflare Bot Fight Mode blocks GHA runner IPs (Azure cloud ranges) before
      # the WAF skip rule fires — health checks must bypass the proxy.
      # See wcmchenry3-stack/.github#45.
      backend-url: 'https://bookshelf-api-rxp3.onrender.com'
      health-path: '/health'
    secrets: inherit

  expo-compat:
    needs: [lint-python, lint-frontend, secret-scan]
    uses: wcmchenry3-stack/.github/.github/workflows/called-expo-compat.yml@main
    with:
      working-directory: frontend
    secrets: inherit

  local-path-check:
    needs: [lint-python, lint-frontend, secret-scan]
    uses: wcmchenry3-stack/.github/.github/workflows/called-local-path-check.yml@main
    with:
      scan-paths: 'frontend/ios/BookShelfAI.xcodeproj,frontend/android'
      file-patterns: '*.pbxproj,*.xcconfig,*.gradle,*.properties'
    secrets: inherit

  sentry-check:
    needs: [lint-python, lint-frontend, secret-scan]
    uses: wcmchenry3-stack/.github/.github/workflows/called-sentry-check.yml@main
    with:
      working-directory: backend
    secrets:
      SENTRY_DSN: ${{ secrets.SENTRY_BC_BOOKSHELF }}

  openai-policy:
    needs: [lint-python, lint-frontend, secret-scan]
    uses: wcmchenry3-stack/.github/.github/workflows/called-openai-policy.yml@main
    secrets: inherit

  # In-repo (not a called-* org workflow): the check lives in
  # scripts/policy/check_claude_policy.py and mirrors .claude/policies/claude.md.
  claude-policy:
    needs: [lint-python, lint-frontend, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/policy/check_claude_policy.py

  provenance-coverage:
    needs: [lint-python, lint-frontend, secret-scan]
    uses: wcmchenry3-stack/.github/.github/workflows/called-provenance-coverage.yml@main
    secrets: inherit

  feedback-token-lint:
    needs: [lint-python, lint-frontend, secret-scan]
    uses: wcmchenry3-stack/.github/.github/workflows/called-feedback-token-lint.yml@main
    secrets: inherit

  test-python:
    needs: [lint-python, lint-frontend, secret-scan]
    uses: wcmchenry3-stack/.github/.github/workflows/called-test-python.yml@main
    with:
      working-directory: backend
      # App code only (backend/.coveragerc omits tests/ and alembic/). Raised
      # from 80 to 90 in #621 once the gate actually failed below threshold, then
      # to 98 in #765 (measured 99.47% on the no-DB run; owner chose 98 for headroom).
      coverage-threshold: 98
    secrets: inherit

  test-frontend:
    needs: [lint-python, lint-frontend, secret-scan]
    uses: wcmchenry3-stack/.github/.github/workflows/called-test-frontend.yml@main
    with:
      working-directory: frontend
      coverage-threshold: 80
    secrets: inherit

  cve-python:
    needs: [lint-python, lint-frontend, secret-scan]
    uses: wcmchenry3-stack/.github/.github/workflows/called-cve-python.yml@main
    with:
      working-directory: backend
    secrets: inherit

  cve-frontend:
    needs: [lint-python, lint-frontend, secret-scan]
    uses: wcmchenry3-stack/.github/.github/workflows/called-cve-frontend.yml@main
    with:
      working-directory: frontend
      audit-level: critical
    secrets: inherit

  sast-python:
    needs: [lint-python, lint-frontend, secret-scan]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
        with:
          requirements: ''
      - name: Install bandit
        run: pip install bandit[toml]==1.8.3
      - name: Run Bandit SAST
        run: bandit -r app/ -c .bandit -ll --format json -o bandit-report.json || true
      - name: Fail on HIGH or MEDIUM severity findings
        run: |
          python -c "
          import json, sys
          with open('bandit-report.json') as f:
              report = json.load(f)
          issues = report.get('results', [])
          high = [i for i in issues if i['issue_severity'] in ('HIGH', 'MEDIUM')]
          if high:
              for i in high:
                  print(f\"FAIL [{i['issue_severity']}] {i['issue_text']} — {i['filename']}:{i['line_number']}\")
              sys.exit(1)
          print(f'Bandit OK: {len(issues)} total issues, 0 HIGH/MEDIUM.')
          "
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-report
          path: backend/bandit-report.json
          retention-days: 30

  test-migrations:
    needs: [lint-python, lint-frontend, secret-scan]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - name: Upgrade to head
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: alembic upgrade head
      - name: Check for unmigrated model changes
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: alembic check
      - name: Smoke-test downgrade
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: alembic downgrade -1
      - name: Integration tests (real Postgres)
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          # Abort (instead of silently skipping) if no real DB is configured (#760).
          REQUIRE_DB_TESTS: '1'
        run: |
          pip install -r requirements-dev.txt
          alembic upgrade head
          # Every integration-marked test in every folder (tests/integration,
          # tests/limits, tests/security, tests/unit, ...). -rs lists skips and the
          # summary line shows how many ran, so a mass skip is visible (#760).
          pytest -m integration tests -q -rs

  # --- Podfile.lock staleness check -------------------------------------------
  # If Podfile was modified but Podfile.lock was not, the developer forgot to
  # run `pod install` locally. A stale lock file causes pod version drift and
  # runtime crashes on Xcode Cloud.

  podfile-lock-check:
    if: github.event_name == 'pull_request'
    needs: [lint-python, lint-frontend, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Podfile.lock is updated when Podfile changes
        run: |
          CHANGED_FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)
          if echo "$CHANGED_FILES" | grep -q 'frontend/ios/Podfile$'; then
            if ! echo "$CHANGED_FILES" | grep -q 'frontend/ios/Podfile.lock'; then
              echo "::error::Podfile was modified but Podfile.lock was not updated. Run 'pod install' locally and commit the lock file."
              exit 1
            fi
          fi
          echo "Podfile.lock check passed"

  typecheck-frontend:
    needs: [lint-python, lint-frontend, secret-scan]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: Type-check (tsc --noEmit)
        run: npm run typecheck

  # --- Phase 5: JS bundle validation (Linux, fast) ---------------------------
  # Catches silent bundling failures BEFORE they reach Xcode Cloud.
  # The Xcode build check below only compiles in Debug mode (SKIP_BUNDLING=1),
  # so it cannot detect issues with the JS bundler or entry-point resolution.

  js-bundle-check:
    if: needs.detect-changes.outputs.frontend == 'true'
    needs: [detect-changes, lint-python, lint-frontend, secret-scan]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: Create iOS JS bundle
        run: |
          ENTRY_FILE=$(node -e "require('expo/scripts/resolveAppEntry')" . ios absolute | tail -n 1)
          npx expo export:embed \
            --platform ios \
            --dev false \
            --entry-file "$ENTRY_FILE" \
            --bundle-output /tmp/main.jsbundle \
            --assets-dest /tmp/assets
      - name: Validate bundle
        run: |
          if [ ! -f /tmp/main.jsbundle ]; then
            echo "::error::main.jsbundle was not created — the iOS app will crash on launch"
            exit 1
          fi
          BUNDLE_SIZE=$(stat --printf="%s" /tmp/main.jsbundle)
          if [ "$BUNDLE_SIZE" -lt 1000 ]; then
            echo "::error::main.jsbundle is only ${BUNDLE_SIZE} bytes — likely corrupted"
            exit 1
          fi
          echo "✓ main.jsbundle created successfully (${BUNDLE_SIZE} bytes)"

  # --- Phase 6: Android JS bundle validation (Linux, fast) -------------------
  # Catches silent bundling failures BEFORE they reach EAS Build.
  # The Android build check below only compiles in Debug mode (skips bundling),
  # so it cannot detect issues with the JS bundler or entry-point resolution.

  android-bundle-check:
    if: needs.detect-changes.outputs.frontend == 'true'
    needs: [detect-changes, lint-python, lint-frontend, secret-scan]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: Create Android JS bundle
        run: |
          ENTRY_FILE=$(node -e "require('expo/scripts/resolveAppEntry')" . android absolute | tail -n 1)
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file "$ENTRY_FILE" \
            --bundle-output /tmp/index.android.bundle \
            --assets-dest /tmp/assets
      - name: Validate bundle
        run: |
          if [ ! -f /tmp/index.android.bundle ]; then
            echo "::error::index.android.bundle was not created — the Android app will crash on launch"
            exit 1
          fi
          BUNDLE_SIZE=$(stat --printf="%s" /tmp/index.android.bundle)
          if [ "$BUNDLE_SIZE" -lt 1000 ]; then
            echo "::error::index.android.bundle is only ${BUNDLE_SIZE} bytes — likely corrupted"
            exit 1
          fi
          echo "Android JS bundle created successfully (${BUNDLE_SIZE} bytes)"

  # === Tier 2: Expensive checks (need unit tests) ==========================

  ios-build-check:
    # Skipped on draft PRs and when no native-affecting path changed.
    if: needs.detect-changes.outputs.native == 'true' && github.event.pull_request.draft != true
    needs: [detect-changes, test-python, test-frontend]
    uses: wcmchenry3-stack/.github/.github/workflows/called-ios-build-check.yml@main
    with:
      working-directory: frontend
      workspace-name: 'BookShelfAI.xcworkspace'
      scheme: 'BookShelfAI'
    secrets: inherit

  android-build-check:
    # Skipped on draft PRs and when no native-affecting path changed.
    if: needs.detect-changes.outputs.native == 'true' && github.event.pull_request.draft != true
    needs: [detect-changes, test-python, test-frontend]
    uses: wcmchenry3-stack/.github/.github/workflows/called-android-build-check.yml@main
    with:
      working-directory: frontend
    secrets: inherit

  # --- Required-check gate (#767) -------------------------------------------
  # A reusable-workflow caller skipped by `if:` reports as plain
  # `ios-build-check` (skipped), never as `ios-build-check / Xcode Build (no
  # signing)`, so that inner context can never be a required check. This job
  # always reports under a stable name and is the required check instead.
  # Passes when every needed job succeeded or was skipped; fails on failure,
  # cancelled, or if detect-changes itself did not succeed.
  native-build-gate:
    if: always()
    needs: [detect-changes, ios-build-check, android-build-check, js-bundle-check, android-bundle-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate conditional build checks
        env:
          DETECT: ${{ needs.detect-changes.result }}
          IOS_BUILD: ${{ needs.ios-build-check.result }}
          ANDROID_BUILD: ${{ needs.android-build-check.result }}
          JS_BUNDLE: ${{ needs.js-bundle-check.result }}
          ANDROID_BUNDLE: ${{ needs.android-bundle-check.result }}
        run: |
          echo "| job | result |"
          echo "|---|---|"
          echo "| detect-changes | $DETECT |"
          echo "| ios-build-check | $IOS_BUILD |"
          echo "| android-build-check | $ANDROID_BUILD |"
          echo "| js-bundle-check | $JS_BUNDLE |"
          echo "| android-bundle-check | $ANDROID_BUNDLE |"
          if [ "$DETECT" != "success" ]; then
            echo "::error::detect-changes did not succeed ($DETECT)"
            exit 1
          fi
          for r in "$IOS_BUILD" "$ANDROID_BUILD" "$JS_BUNDLE" "$ANDROID_BUNDLE"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::A conditional build check ended as '$r'"
              exit 1
            fi
          done
          echo "Conditional build checks OK"

  # --- Gradle wrapper validation --------------------------------------------
  # Validates the Gradle wrapper JAR checksum to prevent supply-chain attacks.
  # Equivalent of podfile-lock-check for the Android build toolchain.

  gradle-wrapper-check:
    if: github.event_name == 'pull_request'
    needs: [lint-python, lint-frontend, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Check Gradle build file consistency
        run: |
          CHANGED_FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)
          if echo "$CHANGED_FILES" | grep -qE 'frontend/android/(app/)?build\.gradle|frontend/android/settings\.gradle'; then
            echo "::notice::Android Gradle build files changed — ensure gradle.properties settings (SDK versions, Hermes, architectures) are still correct."
          fi
          echo "Gradle wrapper validation passed"
