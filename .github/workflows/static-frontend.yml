name: Static Frontend Checks

on:
  pull_request:
    # feature/sdk58-upgrade: Expo SDK 58 integration branch (epic #710), so story
    # PRs into it get CI. Remove at cutover (#717).
    branches: [main, dev, feature/sdk58-upgrade]
    # No paths filter: the job must always report, so it can be a required check.
  merge_group:
    types: [checks_requested]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  static-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: Unused files, exports and dependencies (knip)
        run: npm run knip
