name: Static Frontend Checks

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - ".github/workflows/static-frontend.yml"
      - ".github/actions/setup-frontend/**"
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  static-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: Unused files, exports and dependencies (knip)
        run: npm run knip
