# Node + npm cache + `npm ci` in frontend/. Used by every workflow job that
# builds or tests the Expo app. Node version pins live here, not in each job
# (CLAUDE.md rule 12: change a pin only after verifying npm compatibility).
name: Setup frontend
description: Set up Node.js with the npm cache and install frontend dependencies (npm ci in frontend/).

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: '22'
  install:
    description: "'true' runs npm ci in frontend/. 'false' only sets up Node and the cache."
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: frontend
      run: npm ci
